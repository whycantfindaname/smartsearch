[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-search"
version = "0.1.17"
description = "CLI-first multi-source web research with structured Agentic Research workspaces, xAI/OpenAI-compatible search, Exa, Context7, Zhipu, Tavily, Firecrawl, and Deep Research planning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "httpx[socks]>=0.28.0",
    "InquirerPy>=0.3.4,<0.4",
    "pyfiglet>=1.0,<2",
    "rich>=13.9,<16",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_search = [
    "assets/research_visualizer/*.html",
    "assets/research_visualizer/*.md",
    "assets/sidecar/README.md",
    "assets/sidecar/pyproject.toml",
    "assets/sidecar/src/smart_search_sidecar/*.py",
    "assets/skills/smart-search-cli/SKILL.md",
    "assets/skills/smart-search-cli/agents/*.yaml",
    "assets/skills/smart-search-cli/references/*.md",
    "assets/skills/smart-search-cli/bundled-skills/anysearch-source.json",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/.env.example",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/CONTRACT.md",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/LICENSE",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/NOTICE",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/README.md",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/requirements.txt",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/runtime.conf.example",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/*.js",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/*.ps1",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/*.py",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/*.sh",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/shared/*.json",
    "assets/skills/smart-search-cli/bundled-skills/anysearch/scripts/shared/*.md",
]

[project.scripts]
smart-search = "smart_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
