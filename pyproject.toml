[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-search"
version = "0.1.16"
description = "CLI-first multi-source web research with xAI/OpenAI-compatible search, Exa, Context7, Zhipu, Tavily, Firecrawl, and Deep Research planning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.28.0",
    "InquirerPy>=0.3.4,<0.4",
    "pyfiglet>=1.0,<2",
    "rich>=13.9,<16",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_search = [
    "assets/skills/smart-search-cli/SKILL.md",
    "assets/skills/smart-search-cli/agents/*.yaml",
    "assets/skills/smart-search-cli/references/*.md",
    "assets/skills/smart-search-cli/skills/anysearch-source.json",
    "assets/skills/smart-search-cli/skills/anysearch/.env.example",
    "assets/skills/smart-search-cli/skills/anysearch/LICENSE",
    "assets/skills/smart-search-cli/skills/anysearch/NOTICE",
    "assets/skills/smart-search-cli/skills/anysearch/README.md",
    "assets/skills/smart-search-cli/skills/anysearch/SKILL.md",
    "assets/skills/smart-search-cli/skills/anysearch/requirements.txt",
    "assets/skills/smart-search-cli/skills/anysearch/runtime.conf.example",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/*.js",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/*.ps1",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/*.py",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/*.sh",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/shared/*.json",
    "assets/skills/smart-search-cli/skills/anysearch/scripts/shared/*.md",
]

[project.scripts]
smart-search = "smart_search.cli:main"
