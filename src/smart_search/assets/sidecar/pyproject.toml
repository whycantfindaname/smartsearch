[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smart-search-toolkit-sidecar"
version = "0.1.0"
description = "Isolated Python 3.12 document-mining sidecar for Smart Search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "mistralai-search-toolkit[text-splitter-langchain]==0.0.11",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
smart-search-sidecar = "smart_search_sidecar.protocol:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_search_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
