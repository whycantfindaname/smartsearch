feature: 2026-07-06-sciverse-academic-provider
created: 2026-07-06

steps:
  - action: "配置与 provider 骨架：新增 Sciverse config 和 HTTP adapter"
    exit_signal: "focused provider/config tests 证明 token 缺失不发网络请求，token 存在时发送 Bearer header"
    status: done
  - action: "五个 provider 计算节点：实现 catalog/search/semantic/read/relations 的 payload、归一化和错误映射"
    exit_signal: "provider tests 覆盖 200、400、401、429、timeout、非 JSON、relations enum，以及 search page_size 最大 50、semantic top_k 最大 30、read limit 最大 16384、relations page_size 最大 200 的本地 parameter_error"
    status: done
  - action: "Service 与 capability 诊断：新增 service wrappers、profile 和 capability status，同时保持 standard 与默认路由不变"
    exit_signal: "service tests 证明 Sciverse 不改变 standard required capabilities，也不被默认 search/research 调用"
    status: done
  - action: "CLI 命令面：新增五个 sciverse-* 命令、aliases、JSON 参数校验、setup/config flags 和渲染"
    exit_signal: "CLI tests 证明 parser/dispatch/exit code 正确，非法 JSON 在 service call 前失败"
    status: done
  - action: "文档与 skill 同步：更新 README.md、README.zh-CN.md、provider contract、public skill、packaged skill 的 Sciverse 边界说明"
    exit_signal: "skill 同步 regression 通过，README.md、README.zh-CN.md 和 skill 文档中没有把 Sciverse 写入 default search/research fallback"
    status: done
  - action: "回归与可选 live smoke：跑 provider regression、mock smoke 和 diff check；有 token 时补 live 最小链路"
    exit_signal: "blocking commands 全绿；若执行 live smoke，响应摘要脱敏且 secret scan 无命中"
    status: done

