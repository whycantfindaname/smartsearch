    source: 范围守护
    status: passed
  - item: "SCIVERSE_API_TOKEN 缺失时显式命令返回 config_error 且不发网络请求"
    source: 流程级约束
    status: passed
  - item: "SCIVERSE_API_URL 默认 https://api.sciverse.space，可通过配置覆盖"
    source: 名词契约
    status: passed
  - item: "SciverseProvider 暴露 catalog/search/semantic/read/relations 五个 public method"
    source: 名词契约
    status: passed
  - item: "sciverse-search 支持常用字段参数和 filters/sort JSON 逃生舱"
    source: 名词契约
    status: passed
  - item: "sciverse-relations 保持 CITATIONS / REFERENCES / RELATED_WORKS 方向清楚"
    source: 名词契约
    status: passed
  - item: "错误映射覆盖 config/auth/parameter/rate-limit/timeout/network/provider/parse"
    source: 流程级约束
    status: passed
  - item: "参数上限覆盖 search page_size 最大 50、semantic top_k 最大 30、read limit 最大 16384、relations page_size 最大 200，越界时本地 parameter_error 且不调用 provider"
    source: 流程级约束
    status: passed
  - item: "挂载配置 key：SCIVERSE_API_TOKEN、SCIVERSE_API_URL、SCIVERSE_TIMEOUT_SECONDS"
    source: 挂载点
