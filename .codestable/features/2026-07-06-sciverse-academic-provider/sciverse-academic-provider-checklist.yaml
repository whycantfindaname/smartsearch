  - item: "README.md、README.zh-CN.md、public skill、packaged skill 和 provider contract 均说明 Sciverse 是显式实验 provider"
    source: 验收场景
    status: passed

dod:
  commands:
    - id: CMD-001
      command: '.\.venv\Scripts\python.exe -m compileall -q src tests'
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: '.\.venv\Scripts\python.exe -m pytest tests\test_sciverse_provider.py tests\test_service.py tests\test_cli.py tests\test_smoke.py -q'
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: '.\.venv\Scripts\python.exe -m smart_search.cli regression'
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: '.\.venv\Scripts\python.exe -m smart_search.cli smoke --mock --format json'
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: 'git diff --check'
      core: true
      failure_handling: fix-or-block
    - id: CMD-006
      command: '.\.venv\Scripts\python.exe -m smart_search.cli sciverse-catalog --format json'
      core: false
      failure_handling: document-baseline
  evidence_required:
    - command_output
    - diff_summary
    - review_report
    - qa_report
  cleanliness:
    debug_output: forbidden
    todo_fixme: forbidden
    commented_code: forbidden
    unused_imports: forbidden
    secrets: forbidden
